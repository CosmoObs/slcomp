version: 2
updates:
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    ignore:
      # Keep the compiler within typescript-eslint's supported API range.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Node types must match the Node 24 runtime in .nvmrc and CI.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      react:
        patterns: [react, react-dom, '@types/react*']
      material-ui:
        patterns: ['@mui/*', '@emotion/*']
      tooling:
        dependency-type: development
        exclude-patterns: ['@types/react*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
