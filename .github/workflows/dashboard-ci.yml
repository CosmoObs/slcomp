name: Dashboard CI

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/**'
  push:
    branches: [main, streamlit]
    paths:
      - 'dashboard/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: dashboard/.python-version
          cache: pip
          cache-dependency-path: dashboard/requirements-deploy.txt
      - run: python -m pip install --require-hashes -r requirements-deploy.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci
      - run: npm run check
      - name: Prepare build fixtures (no MinIO credentials)
        run: node scripts/prepare-ci-data.mjs
      - name: Build for GitHub Pages
        env:
          BASE_PATH: /slcomp/
        run: npm run build
      - name: Verify build artifacts
        run: node scripts/check-build.mjs
